<div class="modal fade noselect" id="fusionDexModal" tabindex="-1" role="dialog" aria-labelledby="fusionDexModalLabel">
    <div class="modal-dialog modal-dialog-scrollable modal-xl pokedex-modal" role="document">
        <div class="modal-content">

            <div class="modal-header p-lg-0 border-lg-0 position-relative">
                <h4 class="d-lg-none d-block" style="margin-bottom: 0">Fusionsdex</h4>
                <div class="row w-100 m-0 py-1 d-lg-flex d-none">
                    <div class="col-3">
                        <div class="pokedex-border-bottom pt-2">
                            <h4>Filter und Einstellungen</h4>
                        </div>
                    </div>
                    <div class="col-9">
                        <div class="pokedex-border-bottom pt-2">
                            <h4 data-bind="text: FusionDex.filteredList().length ? `${FusionDex.filteredList().length} Fusionen · ${App.game.fusionWorld.dexCount()}/${FusionData.species.length} gefangen` : 'Keine Fusion gefunden'"></h4>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-danger position-absolute" data-dismiss="modal" style="right:0; top:0; font-size: 18px; font-weight: 700;">×</button>
            </div>

            <div class="modal-body pt-0 overflow-hidden" style="background-color: inherit;">
                <div class="row">
                    <div class="col-12 d-lg-none d-block">
                        <button class="w-100 my-1 btn btn-secondary" type="button" data-toggle="collapse"
                                data-target="#fusiondex-filter-container" aria-expanded="false" aria-controls="fusiondex-filter-container">
                            Filter und Einstellungen
                        </button>
                    </div>
                    <!-- Filters and Settings -->
                    <div class="col-lg-3 col-12 collapse dont-collapse-lg" id="fusiondex-filter-container" style="background-color: inherit; top: 0; z-index: 100;">
                        <div class="scrolling-div-pokedex" style="margin-bottom: 0.5rem;">
                            <div class="container-fluid py-3">
                                <div class="form-row text-left">
                                    <div class="form-group col-12">
                                        <label for="fusiondex-filter-name">Name oder Nr.</label>
                                        <input id="fusiondex-filter-name" class="form-control" placeholder="Gluragoran, Glurak oder 6.149" data-bind="textInput: FusionDex.search">
                                    </div>

                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-type1">Typ 1 (Kopf)</label>
                                        <select id="fusiondex-filter-type1" class="custom-select" data-bind="options: FusionDex.typeOptions, optionsText: 'text', optionsValue: 'value', value: FusionDex.type1"></select>
                                    </div>
                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-type2">Typ 2 (Körper)</label>
                                        <select id="fusiondex-filter-type2" class="custom-select" data-bind="options: FusionDex.typeOptions2, optionsText: 'text', optionsValue: 'value', value: FusionDex.type2"></select>
                                    </div>

                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-head">Kopf</label>
                                        <select id="fusiondex-filter-head" class="custom-select" data-bind="options: FusionDex.headOptions(), optionsText: 'text', optionsValue: 'value', value: FusionDex.head"></select>
                                    </div>
                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-body">Körper</label>
                                        <select id="fusiondex-filter-body" class="custom-select" data-bind="options: FusionDex.bodyOptions(), optionsText: 'text', optionsValue: 'value', value: FusionDex.body"></select>
                                    </div>

                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-area">Fundort</label>
                                        <select id="fusiondex-filter-area" class="custom-select" data-bind="options: FusionDex.areaOptions, optionsText: 'text', optionsValue: 'value', value: FusionDex.area"></select>
                                    </div>
                                    <div class="form-group col-6">
                                        <label for="fusiondex-filter-status">Fangstatus</label>
                                        <select id="fusiondex-filter-status" class="custom-select" data-bind="options: FusionDex.statusOptions, optionsText: 'text', optionsValue: 'value', value: FusionDex.status"></select>
                                    </div>

                                    <div class="form-group col-12 mb-1">
                                        <button class="btn btn-sm btn-block btn-outline-secondary" data-bind="click: () => FusionDex.reset()">Alle Filter zurücksetzen</button>
                                    </div>
                                    <div class="form-group col-12">
                                        <button class="btn btn-sm btn-block btn-info" data-bind="click: () => FusionDex.showMissing()">Was fehlt mir?</button>
                                    </div>

                                    <div class="col-12">
                                        <hr style="border-color:grey;">
                                    </div>

                                    <div class="form-group col-12 mb-0">
                                        <label for="fusiondex-setting-sort">Sortierung</label>
                                        <div class="input-group">
                                            <select id="fusiondex-setting-sort" class="custom-select" data-bind="options: FusionDex.sortOptions, optionsText: 'text', optionsValue: 'value', value: FusionDex.sort"></select>
                                            <div class="input-group-append bg-primary text-light">
                                                <label class="clickable m-0 pl-2 pr-2" style="font-size: 22px;"
                                                    data-bind="text: FusionDex.descending() ? '⥄' : '⥂', click: () => FusionDex.descending(!FusionDex.descending()),
                                                        tooltip: { title: FusionDex.descending() ? 'Absteigend' : 'Aufsteigend', trigger: 'hover', placement: 'top' }">⥂</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <hr style="border-color:grey;">
                                    </div>
                                    <div class="col-12 small text-muted">
                                        Fusionen gibt es nur in der Fusionswelt. Kopf bestimmt Typ 1, Körper Typ 2 – wie in Pokémon Infinite Fusion.
                                        <a href="#" data-bind="click: () => { $('#fusionDexModal').modal('hide'); $('#fusionCreditsModal').modal('show'); }">Credits der Sprites</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Fusion list -->
                    <div class="col-lg-9 col-12 pokemon-list">
                        <div class="pokedex-border-bottom pt-2 d-lg-none d-block">
                            <h4 data-bind="text: `${FusionDex.filteredList().length} Fusionen`"></h4>
                        </div>
                        <div class="scrolling-div-pokedex">
                            <!-- ko if: DisplayObservables.modalState.fusionDexModal !== 'hidden' -->
                            <ul class="row justify-content-center w-100 p-0 m-0" data-bind="foreach: FusionDex.filteredList()">
                                <li class="col-sm-4 col-md-3 col-lg-2 pokedexEntry" data-bind="style: { background: FusionDex.background(id) }">
                                    <span class="id pokedex-top-text" data-bind="text: FusionDex.number(id)"></span>
                                    <div data-bind="visible: App.game.fusionWorld.isCaught(id)" style="position: absolute; right: 2px; top: -15px;">
                                        <img width="18px" src="assets/images/pokeball/Pokeball.svg"/>
                                    </div>
                                    <img src="" class="pokedex-pokemon-sprite" data-bind="attr: { src: FusionData.image(id) },
                                        css: { 'pokemon-not-seen': !App.game.fusionWorld.isSeen(id), 'pokemon-seen-but-not-caught': App.game.fusionWorld.isSeen(id) && !App.game.fusionWorld.isCaught(id) }">
                                    <!-- ko if: App.game.fusionWorld.isSeen(id) -->
                                    <a class="overlay" data-bind="tooltip: { html: true, title: FusionDex.tooltip(id), trigger: 'hover', placement: 'bottom' }"></a>
                                    <span class="pokedex-bottom-text text-truncate px-1" data-bind="text: name"></span>
                                    <!-- /ko -->
                                    <!-- ko ifnot: App.game.fusionWorld.isSeen(id) -->
                                    <span class="pokedex-bottom-text text-truncate px-1">???</span>
                                    <!-- /ko -->
                                </li>
                            </ul>
                            <!-- /ko -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
