<div id="fusionMap" class="card sortable border-secondary mb-3" data-bind="visible: App.game.fusionWorld.unlocked()">
    <div class="card-header p-0" data-toggle="collapse" href="#fusionMapBody">
        <span>Fusionskarte</span>
    </div>
    <button class="btn btn-sm" style="position: absolute; left: 0px; top: 0px; width: auto; height: 41px;" data-toggle="popover" data-trigger="hover" data-html="true" data-title="Kartenlegende:"
        data-placement="bottom" data-content="<div class='row map-legend'>
            <div class='col-10'>Gesperrt</div><div class='col-2'><span class='float-right px-4 bg-locked'>&nbsp;</span></div>
            <div class='col-10'>Unter 10 Siegen / Arena offen</div><div class='col-2'><span class='float-right px-4 bg-incomplete'>&nbsp;</span></div>
            <div class='col-10'>Ungefangene Fusionen</div><div class='col-2'><span class='float-right px-4 bg-uncaughtPokemon'>&nbsp;</span></div>
            <div class='col-10'>Abgeschlossen</div><div class='col-2'><span class='float-right px-4 bg-completed'>&nbsp;</span></div>
            <div class='col-12'><i>Die Fusionswelt läuft getrennt vom Hauptspiel weiter.</i></div>
        </div>">ⓘ</button>
    <button class="btn btn-sm" style="position: absolute; right: 0px; top: 0px; width: auto; height: 41px;" title="Fusionsdex" data-bind="click: () => FusionUI.openDex(), text: `🧬 ${App.game.fusionWorld.dexCount()}/${FusionData.species.length}`"></button>
    <div id="fusionMapBody" class="card-body p-0 show">
        <p id="fusionMapTooltip" class="btn btn-secondary" style="visibility: hidden;"></p>
        <!-- ko if: App.game.fusionWorld.unlocked() -->
        <svg id="fusionMapSvg" class="region-map" viewBox="0 0 1600 960" preserveAspectRatio="xMaxYMax meet">
            <image width="1600" height="960" href="assets/images/fusion-island.png?v=$VERSION" xlink:href="assets/images/fusion-island.png?v=$VERSION"></image>
            <!-- ko foreach: FusionData.mapPaths -->
            <rect class="fusion-map-path" data-bind="attr: { x: x * 16, y: y * 16, width: w * 16, height: h * 16 }"></rect>
            <!-- /ko -->
            <!-- ko foreach: FusionUI.mapAreas -->
            <g data-bind="click: () => FusionUI.moveTo($data),
                event: { mouseenter: () => FusionUI.showTooltip(FusionUI.areaTooltip($data)), mouseleave: FusionUI.hideTooltip }">
                <rect data-bind="attr: { x: map.x * 16, y: map.y * 16, width: map.w * 16, height: map.h * 16,
                    class: `${kind === 'town' ? 'city ' : ''}${FusionUI.areaCss($data)}` }"></rect>
                <!-- ko if: kind === 'route' -->
                <text style="font-size: 32px" data-bind="visible: App.game.fusionWorld.area() !== id,
                    attr: { x: map.x * 16 + map.w * 8 - 10, y: map.y * 16 + map.h * 8 + 10 }, text: id.slice(1)"></text>
                <!-- /ko -->
                <image width="48" height="48" class="iconLocation" data-bind="visible: App.game.fusionWorld.area() === id || (!!$data.gym && App.game.fusionWorld.area() === $data.gym),
                    attr: { x: map.x * 16 + map.w * 8 - 24, y: map.y * 16 + map.h * 8 - 24, href: `assets/images/profile/trainer-${App.game.profile.trainer() || 0}.png` }"></image>
            </g>
            <!-- /ko -->
        </svg>
        <!-- /ko -->
    </div>
</div>
