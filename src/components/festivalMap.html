<!-- ko if: App.game.festivalWorld.active() -->
<p id="festivalMapTooltip" class="btn btn-secondary" style="visibility: hidden;"></p>
<svg id="festivalMapSvg" class="region-map" viewBox="0 0 1600 960" preserveAspectRatio="xMaxYMax meet">
    <image width="1600" height="960" href="assets/images/festival-archipelago.png?v=$VERSION" xlink:href="assets/images/festival-archipelago.png?v=$VERSION"></image>
    <!-- ko foreach: FestivalData.areas -->
    <g data-bind="click: () => FestivalUI.moveTo($data),
        event: { mouseenter: () => FestivalUI.showTooltip(FestivalUI.areaTooltip($data)), mouseleave: FestivalUI.hideTooltip }">
        <rect data-bind="attr: { x: map.x * 16, y: map.y * 16, width: map.w * 16, height: map.h * 16,
            class: `${kind !== 'route' ? 'city ' : ''}${FestivalUI.areaCss($data)}` }"></rect>
        <image width="48" height="48" class="iconLocation" data-bind="visible: App.game.festivalWorld.area() === id,
            attr: { x: map.x * 16 + map.w * 8 - 24, y: map.y * 16 + map.h * 8 - 24, href: `assets/images/profile/trainer-${App.game.profile.trainer() || 0}.png` }"></image>
    </g>
    <!-- /ko -->
</svg>
<!-- /ko -->
